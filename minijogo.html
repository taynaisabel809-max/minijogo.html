<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Pomerode - Didático</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; }
        #container { width: 600px; background: #34495e; padding: 20px; border-radius: 10px; margin-top: 20px; }
        button { cursor: pointer; background: #27ae60; color: white; border: none; padding: 10px; margin: 5px; }
        canvas { background: #87CEEB; display: block; margin-top: 20px; border-bottom: 5px solid #2ecc71; display: none; }
    </style>
</head>
<body>

<div id="container">
    <div id="etapa-quiz">
        <h1>Gestão de Pomerode</h1>
        <p>⚠️ <strong>AVISO:</strong> Todos os valores e impactos aqui são <strong>estritamente DIDÁTICOS</strong>.</p>
        <div id="pergunta"></div>
        <div id="opcoes"></div>
    </div>
    
    <div id="etapa-jogo" style="display:none;">
        <h3>Sua pontuação inicial: <span id="saldo-inicial">0</span> unidades energéticas.</h3>
        <p>Agora, ajude a cidade na prática! Use A/D para mover.</p>
        <canvas id="gameCanvas" width="600" height="300"></canvas>
    </div>
</div>

<script>
    // Dados do Quiz
    const quiz = [
        { q: "Como gerenciar o lixo da cidade?", opts: { "Reciclagem": 50, "Aterro": 10 } },
        { q: "Expandir o hospital ou a praça?", opts: { "Hospital": 80, "Praça": 30 } }
    ];
    
    let saldo = 0, qIdx = 0;
    
    function mostrarPergunta() {
        if(qIdx < quiz.length) {
            document.getElementById("pergunta").innerText = quiz[qIdx].q;
            let oDiv = document.getElementById("opcoes"); oDiv.innerHTML = "";
            for(let opt in quiz[qIdx].opts) {
                let btn = document.createElement("button"); btn.innerText = opt;
                btn.onclick = () => { saldo += quiz[qIdx].opts[opt]; qIdx++; mostrarPergunta(); };
                oDiv.appendChild(btn);
            }
        } else {
            document.getElementById("etapa-quiz").style.display = "none";
            document.getElementById("etapa-jogo").style.display = "block";
            document.getElementById("saldo-inicial").innerText = saldo;
            document.getElementById("gameCanvas").style.display = "block";
            iniciarJogo();
        }
    }

    // --- JOGO ---
    function iniciarJogo() {
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let tempo = 120, playerX = 280;
        
        const loop = setInterval(() => {
            if(tempo <= 0) {
                clearInterval(loop);
                let impacto = Math.floor(saldo / 50);
                alert(`FIM! Saldo Final: ${saldo} energias.\n` +
                      `Hospitais ajudados: ${impacto}\n` +
                      `Escolas apoiadas: ${impacto + 2}\n` +
                      `Postos de Saúde: ${impacto + 1}\n` +
                      `⚠️ Valores estritamente didáticos.`);
            }
            tempo--;
            // (Desenho do Colono e Portal fixo no chão aqui...)
        }, 1000);
    }

    mostrarPergunta();
</script>
</body>
</html>
