<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Missão Sustentável - Pomerode</title>
    <style>
        body { margin: 0; padding: 0; background: #eef2f3; display: flex; flex-direction: column; align-items: center; overflow: hidden; font-family: sans-serif; }
        #hud { display: flex; justify-content: space-around; width: 600px; background: #2c3e50; color: white; padding: 10px; font-weight: bold; border-radius: 0 0 8px 8px; }
        canvas { background: #87CEEB; display: block; margin-top: 5px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="hud">
        <span id="txt-tempo">Tempo: 120s</span>
        <span id="txt-pontos">Pontos: 0</span>
        <span id="txt-recorde">Recorde: 0</span>
        <span id="txt-co2">CO₂: 12.5 kg</span>
    </div>

    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let tempo = 120, pontos = 0, co2 = 12.5, qualidade = 100, pausado = false;
        let recorde = localStorage.getItem("recordePomerode") || 0;
        document.getElementById("txt-recorde").innerText = "Recorde: " + recorde;

        let player = { x: 280, y: 370, w: 45, h: 60, speed: 8, dx: 0 };
        let objetos = [];
        let teclas = {};

        window.addEventListener("keydown", (e) => { 
            const k = e.key.toLowerCase();
            if(k === 'p') pausado = !pausado;
            if(k === "arrowleft" || k === "a") teclas["left"] = true;
            if(k === "arrowright" || k === "d") teclas["right"] = true;
        });
        window.addEventListener("keyup", (e) => { 
            const k = e.key.toLowerCase();
            if(k === "arrowleft" || k === "a") teclas["left"] = false;
            if(k === "arrowright" || k === "d") teclas["right"] = false;
        });

        function desenharPortal() {
            // Pilares
            ctx.fillStyle = "#5d4037";
            ctx.fillRect(50, 150, 100, 200); ctx.fillRect(450, 150, 100, 200);
            ctx.fillRect(50, 120, 500, 30); // Travessa

            // Texto
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 25px Arial"; ctx.textAlign = "center";
            ctx.fillText("POMERODE", 300, 142);

            // Telhados
            ctx.fillStyle = "#8b4513";
            ctx.beginPath(); ctx.moveTo(30, 150); ctx.lineTo(100, 60); ctx.lineTo(170, 150); ctx.fill();
            ctx.beginPath(); ctx.moveTo(430, 150); ctx.lineTo(500, 60); ctx.lineTo(570, 150); ctx.fill();

            // Luzes Natalinas (Ambos os lados, piscam se qualidade baixa)
            let piscar = qualidade < 50 && Math.floor(Date.now() / 200) % 2 === 0;
            if (qualidade >= 50 || !piscar) {
                ctx.fillStyle = "#f1c40f";
                for(let i=0; i<30; i++) {
                    ctx.fillRect(30 + i*4.6, 150 - (i%5)*10, 5, 5); // Esq
                    ctx.fillRect(430 + i*4.6, 150 - (i%5)*10, 5, 5); // Dir
                }
            }
        }

        function loop() {
            if (pausado) return;

            // Fundo e Chão
            ctx.fillStyle = `rgb(${135*(qualidade/100)}, ${206*(qualidade/100)}, ${235*(qualidade/100)})`;
            ctx.fillRect(0,0, 600, 450);
            ctx.fillStyle = "#2ecc71"; ctx.fillRect(0, 435, 600, 15);

            desenharPortal();

            // Jogador (Controle por setas e A/D)
            if(teclas["left"]) player.x -= player.speed;
            if(teclas["right"]) player.x += player.speed;
            player.x = Math.max(0, Math.min(560, player.x));
            
            // Boneco detalhado com rosto
            ctx.fillStyle = "#34495e";
            ctx.fillRect(player.x + 8, player.y + 45, 8, 15);
            ctx.fillRect(player.x + 24, player.y + 45, 8, 15);
            ctx.fillStyle = "#27ae60"; ctx.fillRect(player.x + 5, player.y + 20, 30, 25);
            ctx.fillStyle = "#d35400"; ctx.fillRect(player.x - 3, player.y + 22, 8, 15); ctx.fillRect(player.x + 35, player.y + 22, 8, 15);
            ctx.fillStyle = "#f39c12"; ctx.beginPath(); ctx.arc(player.x + 20, player.y + 10, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(player.x + 16, player.y + 8, 2, 2); ctx.fillRect(player.x + 22, player.y + 8, 2, 2);
            ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(player.x + 20, player.y + 11, 4, 0, Math.PI); ctx.stroke();
            ctx.fillStyle = "#4a2511"; ctx.fillRect(player.x + 12, player.y + 1, 16, 5);
            ctx.fillStyle = "#e67e22"; ctx.fillRect(player.x + 5, player.y - 3, 30, 4); ctx.fillRect(player.x + 12, player.y - 9, 16, 6);

            // Objetos
            if(Math.random() < 0.03) {
                let isRuim = Math.random() > 0.5;
                objetos.push({x: Math.random()*560, y:0, tipo: isRuim ? 'ruim' : 'bom', emoji: isRuim ? '🏭' : '🌳'});
            }
            
            objetos.forEach((o, i) => {
                o.y += 4;
                if (o.tipo === 'ruim') {
                    ctx.fillStyle = "rgba(255,0,0,0.3)";
                    ctx.beginPath(); ctx.arc(o.x+12, o.y+12, 25, 0, Math.PI*2); ctx.fill();
                }
                ctx.font = "30px sans-serif"; ctx.fillText(o.emoji, o.x, o.y);
                
                if (o.y > 370 && o.y < 430 && Math.abs(o.x - player.x) < 30) {
                    if(o.tipo === 'bom') {
                        pontos += 10;
                        qualidade = Math.min(100, qualidade + 5);
                    } else {
                        pontos -= 10;
                        qualidade = Math.max(0, qualidade - 10);
                    }
                    objetos.splice(i, 1);
                    document.getElementById("txt-pontos").innerText = "Pontos: " + pontos;
                } else if(o.y > 450) {
                    objetos.splice(i, 1);
                }
            });

            if (pausado) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("JOGO PAUSADO", canvas.width / 2, canvas.height / 2);
                ctx.font = "16px sans-serif";
                ctx.fillText("Pressione 'P' para continuar", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        setInterval(loop, 30);

        const timerInterval = setInterval(() => {
            if (tempo > 0 && !pausado) {
                tempo--;
                document.getElementById("txt-tempo").innerText = `Tempo: ${tempo}s`;
            } else if (tempo <= 0 && !pausado) {
                clearInterval(timerInterval);
                
                if (pontos > recorde) {
                    recorde = pontos;
                    localStorage.setItem("recordePomerode", recorde);
                }

                ctx.fillStyle = "rgba(20, 30, 40, 0.95)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#f1c40f"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("Fim da Missão em Pomerode!", canvas.width / 2, 40);
                
                ctx.fillStyle = "white"; ctx.font = "14px sans-serif";
                ctx.fillText(`Pontuação Final: ${pontos} | Recorde: ${recorde}`, canvas.width / 2, 80);
                ctx.fillText(`Pressione F5 para jogar novamente.`, canvas.width / 2, 220);
            }
        }, 1000);
    </script>
</body>
</html>
