<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Missão Sustentável - Pomerode</title>
    <style>
        body { margin: 0; padding: 0; background: #eef2f3; display: flex; flex-direction: column; align-items: center; overflow: hidden; font-family: sans-serif; }
        #hud { display: flex; justify-content: space-around; width: 600px; background: #2c3e50; color: white; padding: 10px; font-weight: bold; border-radius: 0 0 8px 8px; font-size: 14px; }
        canvas { background: #87CEEB; display: block; margin-top: 5px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="hud">
        <span id="txt-tempo">Tempo: 120s</span>
        <span id="txt-pontos">Pontos: 0</span>
        <span id="txt-recorde">Recorde: 0</span>
        <span id="txt-co2">CO₂: 12.5 kg</span>
    </div>

    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let tempo = 120, pontos = 0, co2 = 12.5, qualidade = 100, pausado = false;
        let itensBonsColetados = 0, itensRuinsColetados = 0;
        let tempoPiscarPortal = 0; // Controle para o piscar do erro
        let recorde = localStorage.getItem("recordePomerode") || 0;
        document.getElementById("txt-recorde").innerText = "Recorde: " + recorde;

        let player = { x: 280, y: 370, w: 45, h: 60, speed: 8 };
        let objetos = [];
        let teclas = {};

        const listaBons = ["🌳", "🚲", "⚡", "🏫", "🍎", "♻️", "🚌", "☀️", "💧", "🌱", "🌻", "🚰"];
        const listaRuins = ["🏭", "🚗", "🗑️", "🔥", "💨", "☢️", "🧴", "🚬", "⚠️", "🚙", "🛢️", "🚯"];

        window.addEventListener("keydown", (e) => { 
            const k = e.key.toLowerCase();
            if(k === 'p') pausado = !pausado;
            if(k === "arrowleft" || k === "a") teclas["left"] = true;
            if(k === "arrowright" || k === "d") teclas["right"] = true;
        });
        window.addEventListener("keyup", (e) => { 
            const k = e.key.toLowerCase();
            if(k === "arrowleft" || k === "a") teclas["left"] = false;
            if(k === "arrowright" || k === "d") teclas["right"] = false;
        });

        function desenharPortal() {
            ctx.fillStyle = "#5d4037";
            ctx.fillRect(50, 150, 100, 285); 
            ctx.fillRect(450, 150, 100, 285); 
            ctx.fillRect(50, 120, 500, 30);

            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 25px Arial"; ctx.textAlign = "center";
            ctx.fillText("POMERODE", 300, 142);

            // Luzes do portal
            let piscarErro = tempoPiscarPortal > 0 && Math.floor(Date.now() / 100) % 2 === 0;
            ctx.fillStyle = piscarErro ? "#e74c3c" : "#f1c40f";
            for(let i=0; i<30; i++) {
                ctx.fillRect(30 + i*4.6, 150 - (i%5)*10, 5, 5);
                ctx.fillRect(430 + i*4.6, 150 - (i%5)*10, 5, 5);
            }
        }

        function loop() {
            if (pausado) return;
            if (tempoPiscarPortal > 0) tempoPiscarPortal--;

            let fator = qualidade / 100;
            ctx.fillStyle = `rgb(${Math.floor(135 * fator)}, ${Math.floor(206 * fator)}, ${Math.floor(235 * fator)})`;
            ctx.fillRect(0, 0, 600, 450);

            ctx.fillStyle = "#2ecc71"; ctx.fillRect(0, 435, 600, 15);
            desenharPortal();

            if(teclas["left"]) player.x -= player.speed;
            if(teclas["right"]) player.x += player.speed;
            player.x = Math.max(0, Math.min(560, player.x));
            
            // Boneco detalhado
            ctx.fillStyle = "#34495e"; ctx.fillRect(player.x+8, player.y+45, 8, 15); ctx.fillRect(player.x+24, player.y+45, 8, 15);
            ctx.fillStyle = "#27ae60"; ctx.fillRect(player.x+5, player.y+20, 30, 25);
            ctx.fillStyle = "#d35400"; ctx.fillRect(player.x-3, player.y+22, 8, 15); ctx.fillRect(player.x+35, player.y+22, 8, 15);
            ctx.fillStyle = "#f39c12"; ctx.beginPath(); ctx.arc(player.x+20, player.y+10, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#e67e22"; ctx.fillRect(player.x+5, player.y-3, 30, 4);

            if(Math.random() < 0.035) {
                let isRuim = Math.random() > 0.5;
                let emoji = isRuim ? listaRuins[Math.floor(Math.random()*listaRuins.length)] : listaBons[Math.floor(Math.random()*listaBons.length)];
                objetos.push({ x: Math.random()*560, y: 0, tipo: isRuim ? 'ruim' : 'bom', emoji: emoji });
            }
            
            objetos.forEach((o, i) => {
                o.y += 4;
                if (o.tipo === 'ruim') { ctx.fillStyle = "rgba(255,0,0,0.3)"; ctx.beginPath(); ctx.arc(o.x+12, o.y+12, 24, 0, Math.PI*2); ctx.fill(); }
                ctx.font = "30px sans-serif"; ctx.fillText(o.emoji, o.x, o.y);
                
                if (o.y > 370 && o.y < 430 && Math.abs(o.x - player.x) < 30) {
                    if(o.tipo === 'bom') { pontos += 10; qualidade = Math.min(100, qualidade + 5); co2 = Math.max(0, co2 - 0.5); itensBonsColetados++; }
                    else { pontos -= 10; qualidade = Math.max(0, qualidade - 10); co2 += 0.8; itensRuinsColetados++; tempoPiscarPortal = 30; }
                    objetos.splice(i, 1);
                    document.getElementById("txt-pontos").innerText = "Pontos: " + pontos;
                    document.getElementById("txt-co2").innerText = `CO₂: ${co2.toFixed(1)} kg`;
                } else if(o.y > 450) objetos.splice(i, 1);
            });
        }

        setInterval(loop, 30);

        const timerInterval = setInterval(() => {
            if (tempo > 0 && !pausado) {
                tempo--; document.getElementById("txt-tempo").innerText = `Tempo: ${tempo}s`;
            } else if (tempo <= 0 && !pausado) {
                clearInterval(timerInterval);
                ctx.fillStyle = "rgba(20, 30, 40, 0.98)"; ctx.fillRect(0, 0, 600, 450);
                
                ctx.fillStyle = "#f1c40f"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("Extrato de Impacto (Dados Didáticos)", 300, 30);
                
                ctx.fillStyle = "white"; ctx.font = "13px sans-serif";
                ctx.fillText(`Você ajudou a manter a cidade ativa:`, 300, 65);
                ctx.fillText(`🏥 Hospitais: ${Math.max(1, itensBonsColetados)} | 🏫 Escolas: ${Math.max(1, Math.floor(itensBonsColetados*0.8))} | 👮 Polícia/Segurança: ${Math.max(1, Math.floor(itensBonsColetados*1.2))}`, 300, 95);
                ctx.fillText(`⚡ Energia Consumida: Seu impacto de ${co2.toFixed(1)}kg de CO₂ equivale a ${Math.round(co2*15)} minutos de banho em chuveiro elétrico no máximo.`, 300, 130);
                
                ctx.fillStyle = "#e74c3c"; ctx.font = "bold 12px sans-serif";
                ctx.fillText("⚠️ AVISO: TODOS OS DADOS SÃO ESTRITAMENTE DIDÁTICOS.", 300, 200);
                ctx.fillText("NÃO REPRESENTAM VALORES REAIS OU CIENTÍFICOS.", 300, 220);
            }
        }, 1000);
    </script>
</body>
</html>
