<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Missão Sustentável - Pomerode</title>
    <style>
        body { margin: 0; background: #2c3e50; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        #hud { display: flex; justify-content: space-around; width: 600px; background: #34495e; color: white; padding: 10px; font-weight: bold; border-radius: 0 0 8px 8px; font-size: 14px; }
        #aviso { color: #f1c40f; text-align: center; font-size: 11px; margin: 5px; }
        canvas { background: #87CEEB; display: block; border-bottom: 5px solid #27ae60; }
    </style>
</head>
<body>
    <div id="aviso">⚠️ AVISO: Todos os valores energéticos e impactos são ESTRITAMENTE DIDÁTICOS e ilustrativos.</div>
    <div id="hud">
        <span id="txt-tempo">Tempo: 120s</span>
        <span id="txt-status">Partida em Andamento</span>
    </div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let tempo = 120, energiaAcumulada = 0, jogoAtivo = true;
        let player = { x: 280, y: 330, w: 50, h: 60 };
        let objetos = [];
        const posItens = ["🌳", "🚲", "⚡", "🏫", "🍎", "♻️", "🚌", "☀️", "💧", "🏭", "🚗", "🗑️", "🔥", "💨", "☢️", "🧴"];

        function desenharCenario() {
            // Ciclo Dia/Noite simples
            let isNoite = tempo < 60;
            ctx.fillStyle = isNoite ? "#2c3e50" : "#87CEEB";
            ctx.fillRect(0, 0, 600, 400);
            
            // Sol ou Lua
            ctx.fillStyle = isNoite ? "#ecf0f1" : "#f1c40f";
            ctx.beginPath(); ctx.arc(500, 50, 30, 0, Math.PI*2); ctx.fill();

            // Portal no chão
            ctx.fillStyle = "#5d4037";
            ctx.fillRect(150, 200, 300, 195); // Base
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 20px Arial"; ctx.textAlign = "center";
            ctx.fillText("POMERODE", 300, 250);
        }

        function loop() {
            if (!jogoAtivo) return;
            desenharCenario();

            // Lógica de Emojis Dinâmicos
            if(Math.random() < 0.04) {
                let e = posItens[Math.floor(Math.random() * posItens.length)];
                let isBom = ["🌳", "🚲", "⚡", "🏫", "🍎", "♻️", "🚌", "☀️", "💧"].includes(e);
                objetos.push({x: Math.random()*550, y:0, emoji: e, bom: isBom});
            }

            objetos.forEach((o, i) => {
                o.y += 3;
                ctx.font = "30px Arial";
                ctx.fillText(o.emoji, o.x, o.y);
                
                // Colisão
                if (o.y > 330 && Math.abs(o.x - player.x) < 40) {
                    energiaAcumulada += o.bom ? Math.floor(Math.random()*20)+10 : -(Math.floor(Math.random()*15)+5);
                    objetos.splice(i, 1);
                }
            });

            // Jogador
            ctx.fillStyle = "#27ae60"; ctx.fillRect(player.x, player.y, player.w, player.h);
        }

        window.onmousemove = (e) => { player.x = e.clientX - canvas.offsetLeft - 25; };

        const cronometro = setInterval(() => {
            if (tempo > 0) {
                tempo--;
                document.getElementById("txt-tempo").innerText = `Tempo: ${tempo}s`;
            } else {
                jogoAtivo = false;
                clearInterval(cronometro);
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(0,0,600,400);
                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.textAlign = "center";
                ctx.fillText("FIM DE JOGO", 300, 150);
                ctx.fillText(`Energia arrecadada: ${energiaAcumulada} unidades energéticas.`, 300, 200);
                ctx.fillText("Valores ilustrativos para fins didáticos.", 300, 250);
                ctx.fillText("Recarregue a página para nova partida.", 300, 300);
            }
        }, 1000);

        setInterval(loop, 30);
    </script>
</body>
</html>
