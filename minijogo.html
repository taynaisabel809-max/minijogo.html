<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Missão Sustentável - Pomerode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef2f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        #hud {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            background: #2c3e50;
            color: white;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #aviso-alerta {
            background: #e74c3c;
            color: white;
            width: 100%;
            max-width: 600px;
            text-align: center;
            font-size: 12px;
            padding: 4px;
            font-weight: bold;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #e0f6ff);
            display: block;
            margin-top: 5px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="aviso-alerta">⚠️ ATENÇÃO: Desvie dos emojis com luz vermelha ao redor e utilize o portal energético!</div>
    <div id="hud">
        <span id="txt-tempo">Tempo: 120s</span>
        <span id="txt-pontos">Pontos: 0</span>
        <span id="txt-co2">CO₂: 12.5 kg</span>
    </div>

    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let tempoRestante = 120;
        let pontos = 0;
        let co2 = 12.5;

        // Jogador (Colono detalhado com cabeça, rosto, cabelo, braços e pernas)
        let player = {
            x: 270,
            y: 375,
            w: 45,
            h: 60,
            speed: 6,
            dx: 0
        };

        // Portal Energético de Pomerode
        let portal = {
            x: Math.random() * 500 + 50,
            y: 220,
            w: 50,
            h: 50,
            ativo: true
        };

        const itensConfig = [
            // Bons
            { emoji: "🌳", tipo: "bom", pts: 10, co2Change: -1.5, r: 18 },
            { emoji: "⚡", tipo: "bom", pts: 15, co2Change: -2.0, r: 18 },
            { emoji: "🏫", tipo: "bom", pts: 20, co2Change: -2.5, r: 18 },
            { emoji: "🚲", tipo: "bom", pts: 12, co2Change: -1.0, r: 18 },
            // Ruins (Com luz vermelha)
            { emoji: "🏭", tipo: "ruim", pts: -15, co2Change: 4.5, r: 18 },
            { emoji: "🚗", tipo: "ruim", pts: -10, co2Change: 3.0, r: 18 },
            { emoji: "🗑️", tipo: "ruim", pts: -10, co2Change: 2.5, r: 18 }
        ];

        let objetos = [];

        function criarObjeto() {
            if (tempoRestante <= 0) return;
            const config = itensConfig[Math.floor(Math.random() * itensConfig.length)];
            objetos.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                speed: Math.random() * 2 + 2.5,
                emoji: config.emoji,
                tipo: config.tipo,
                pts: config.pts,
                co2Change: config.co2Change,
                r: config.r
            });
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") player.dx = -player.speed;
            if (e.key === "ArrowRight" || e.key === "d") player.dx = player.speed;
        });

        window.addEventListener("keyup", (e) => {
            if ((e.key === "ArrowLeft" || e.key === "a") && player.dx < 0) player.dx = 0;
            if ((e.key === "ArrowRight" || e.key === "d") && player.dx > 0) player.dx = 0;
        });

        function atualizar() {
            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            // Interação com o Portal Energético
            if (portal.ativo) {
                let pDistX = (player.x + player.w/2) - (portal.x + portal.w/2);
                let pDistY = (player.y + player.h/2) - (portal.y + portal.h/2);
                if (Math.sqrt(pDistX * pDistX + pDistY * pDistY) < 40) {
                    pontos += 30; // Bônus do portal
                    co2 -= 3.0;
                    if (co2 < 0) co2 = 0;
                    portal.ativo = false;
                    // Reposiciona o portal após alguns segundos
                    setTimeout(() => {
                        portal.x = Math.random() * 500 + 50;
                        portal.ativo = true;
                    }, 7000);
                }
            }

            // Atualiza objetos que caem
            for (let i = objetos.length - 1; i >= 0; i--) {
                let obj = objetos[i];
                obj.y += obj.speed;

                let distX = (player.x + player.w/2) - obj.x;
                let distY = (player.y + player.h/2) - obj.y;
                let distancia = Math.sqrt(distX * distX + distY * distY);

                if (distancia < 35) {
                    pontos += obj.pts;
                    co2 += obj.co2Change;
                    if (co2 < 0) co2 = 0;
                    objetos.splice(i, 1);
                } else if (obj.y > canvas.height + 30) {
                    objetos.splice(i, 1);
                }
            }
        }

        function desenharBonecoReal() {
            // Pernas
            ctx.fillStyle = "#34495e";
            ctx.fillRect(player.x + 8, player.y + 45, 8, 15);
            ctx.fillRect(player.x + 24, player.y + 45, 8, 15);

            // Tronco / Roupa de Colono
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(player.x + 5, player.y + 20, 30, 25);

            // Braços
            ctx.fillStyle = "#d35400";
            ctx.fillRect(player.x - 3, player.y + 22, 8, 15);
            ctx.fillRect(player.x + 35, player.y + 22, 8, 15);

            // Cabeça (Pele)
            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(player.x + 20, player.y + 10, 10, 0, Math.PI * 2);
            ctx.fill();

            // Cabelo detalhado
            ctx.fillStyle = "#4a2511";
            ctx.fillRect(player.x + 12, player.y + 1, 16, 5);

            // Chapéu típico de colono
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(player.x + 5, player.y - 3, 30, 4);
            ctx.fillRect(player.x + 12, player.y - 9, 16, 6);
        }

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Chão de Pomerode
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(0, canvas.height - 15, canvas.width, 15);

            // Desenhar Portal Energético se estiver ativo
            if (portal.ativo) {
                ctx.save();
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 20;
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(portal.x + portal.w/2, portal.y + portal.h/2, 25, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = "rgba(0, 255, 255, 0.3)";
                ctx.fill();
                ctx.font = "20px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🌀", portal.x + portal.w/2, portal.y + portal.h/2);
                ctx.restore();
            }

            // Desenhar Jogador Real
            desenharBonecoReal();

            // Desenhar Emojis
            for (let obj of objetos) {
                ctx.save();
                if (obj.tipo === "ruim") {
                    ctx.shadowColor = "red";
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(obj.x, obj.y, 22, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
                    ctx.fill();
                }
                ctx.font = "28px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(obj.emoji, obj.x, obj.y);
                ctx.restore();
            }
        }

        function loop() {
            if (tempoRestante > 0) {
                atualizar();
                desenhar();
            }
        }

        setInterval(criarObjeto, 900);

        const timerInterval = setInterval(() => {
            if (tempoRestante > 0) {
                tempoRestante--;
                document.getElementById("txt-tempo").innerText = `Tempo: ${tempoRestante}s`;
                document.getElementById("txt-pontos").innerText = `Pontos: ${pontos}`;
                document.getElementById("txt-co2").innerText = `CO₂: ${co2.toFixed(1)} kg`;
            } else {
                clearInterval(timerInterval);
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "24px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Fim da Missão!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "16px sans-serif";
                ctx.fillText(`Pontuação Final: ${pontos} | CO₂ Final: ${co2.toFixed(1)} kg`, canvas.width / 2, canvas.height / 2 + 20);
            }
        }, 1000);

        setInterval(loop, 1000 / 60);
    </script>
</body>
</html>
