<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Missão Sustentável - Pomerode</title>
    <style>
        body { margin: 0; padding: 0; background: #eef2f3; display: flex; flex-direction: column; align-items: center; overflow: hidden; font-family: sans-serif; }
        #hud { display: flex; justify-content: space-around; width: 600px; background: #2c3e50; color: white; padding: 10px; font-weight: bold; border-radius: 0 0 8px 8px; font-size: 14px; }
        canvas { background: #87CEEB; display: block; margin-top: 5px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="hud">
        <span id="txt-tempo">Tempo: 120s</span>
        <span id="txt-pontos">Pontos: 0</span>
        <span id="txt-recorde">Recorde: 0</span>
        <span id="txt-co2">CO₂: 12.5 kg</span>
    </div>

    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let tempo = 120, pontos = 0, co2 = 12.5, qualidade = 100, pausado = false;
        let itensBonsColetados = 0, itensRuinsColetados = 0;
        let tempoPiscarPortal = 0; // Adicionado apenas para o controle do piscar do portal ao pegar item ruim
        let recorde = localStorage.getItem("recordePomerode") || 0;
        document.getElementById("txt-recorde").innerText = "Recorde: " + recorde;

        let player = { x: 280, y: 370, w: 45, h: 60, speed: 8, dx: 0 };
        let objetos = [];
        let teclas = {};

        const listaBons = ["🌳", "🚲", "⚡", "🏫", "🍎", "♻️", "🚌", "☀️", "💧", "🌱", "🌻", "🚰"];
        const listaRuins = ["🏭", "🚗", "🗑️", "🔥", "💨", "☢️", "🧴", "🚬", "⚠️", "🚙", "🛢️", "🚯"];

        window.addEventListener("keydown", (e) => { 
            const k = e.key.toLowerCase();
            if(k === 'p') pausado = !pausado;
            if(k === "arrowleft" || k === "a") teclas["left"] = true;
            if(k === "arrowright" || k === "d") teclas["right"] = true;
        });
        window.addEventListener("keyup", (e) => { 
            const k = e.key.toLowerCase();
            if(k === "arrowleft" || k === "a") teclas["left"] = false;
            if(k === "arrowright" || k === "d") teclas["right"] = false;
        });

        function desenharPortal() {
            ctx.fillStyle = "#5d4037";
            ctx.fillRect(50, 150, 100, 285); 
            ctx.fillRect(450, 150, 100, 285); 
            ctx.fillRect(50, 120, 500, 30);

            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 25px Arial"; ctx.textAlign = "center";
            ctx.fillText("POMERODE", 300, 142);

            ctx.fillStyle = "#8b4513";
            ctx.beginPath(); ctx.moveTo(30, 150); ctx.lineTo(100, 60); ctx.lineTo(170, 150); ctx.fill();
            ctx.beginPath(); ctx.moveTo(430, 150); ctx.lineTo(500, 60); ctx.lineTo(570, 150); ctx.fill();

            // Modificado: luzes do portal piscam em vermelho quando o jogador pega algo negativo
            let piscarErro = tempoPiscarPortal > 0 && Math.floor(Date.now() / 100) % 2 === 0;
            let piscarBaixaQualidade = qualidade < 50 && Math.floor(Date.now() / 200) % 2 === 0;
            
            if (piscarErro) {
                ctx.fillStyle = "#e74c3c";
            } else if (qualidade >= 50 || !piscarBaixaQualidade) {
                ctx.fillStyle = "#f1c40f";
            }

            if (qualidade >= 50 || !piscarBaixaQualidade || piscarErro) {
                for(let i=0; i<30; i++) {
                    ctx.fillRect(30 + i*4.6, 150 - (i%5)*10, 5, 5);
                    ctx.fillRect(430 + i*4.6, 150 - (i%5)*10, 5, 5);
                }
            }
        }

        function loop() {
            if (pausado) return;
            if (tempoPiscarPortal > 0) tempoPiscarPortal--;

            let fator = qualidade / 100;
            ctx.fillStyle = `rgb(${Math.floor(135 * fator)}, ${Math.floor(206 * fator)}, ${Math.floor(235 * fator)})`;
            ctx.fillRect(0, 0, 600, 450);

            if (qualidade > 50) {
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath(); ctx.arc(520, 70, 25, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = "#ecf0f1";
                ctx.beginPath(); ctx.arc(520, 70, 22, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = "#2ecc71"; 
            ctx.fillRect(0, 435, 600, 15);

            desenharPortal();

            if(teclas["left"]) player.x -= player.speed;
            if(teclas["right"]) player.x += player.speed;
            player.x = Math.max(0, Math.min(560, player.x));
            
            // Boneco de Colono detalhado
            ctx.fillStyle = "#34495e";
            ctx.fillRect(player.x + 8, player.y + 45, 8, 15);
            ctx.fillRect(player.x + 24, player.y + 45, 8, 15);
            ctx.fillStyle = "#27ae60"; ctx.fillRect(player.x + 5, player.y + 20, 30, 25);
            ctx.fillStyle = "#d35400"; ctx.fillRect(player.x - 3, player.y + 22, 8, 15); ctx.fillRect(player.x + 35, player.y + 22, 8, 15);
            ctx.fillStyle = "#f39c12"; ctx.beginPath(); ctx.arc(player.x + 20, player.y + 10, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(player.x + 16, player.y + 8, 2, 2); ctx.fillRect(player.x + 22, player.y + 8, 2, 2);
            ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(player.x + 20, player.y + 11, 4, 0, Math.PI); ctx.stroke();
            ctx.fillStyle = "#4a2511"; ctx.fillRect(player.x + 12, player.y + 1, 16, 5);
            ctx.fillStyle = "#e67e22"; ctx.fillRect(player.x + 5, player.y - 3, 30, 4); ctx.fillRect(player.x + 12, player.y - 9, 16, 6);

            if(Math.random() < 0.035) {
                let isRuim = Math.random() > 0.5;
                let emojiSorteado = isRuim 
                    ? listaRuins[Math.floor(Math.random() * listaRuins.length)]
                    : listaBons[Math.floor(Math.random() * listaBons.length)];
                
                objetos.push({ x: Math.random() * 560, y: 0, tipo: isRuim ? 'ruim' : 'bom', emoji: emojiSorteado });
            }
            
            objetos.forEach((o, i) => {
                o.y += 4;
                if (o.tipo === 'ruim') {
                    ctx.fillStyle = "rgba(255, 0, 0, 0.35)";
                    ctx.beginPath(); ctx.arc(o.x + 12, o.y + 12, 24, 0, Math.PI * 2); ctx.fill();
                }
                
                ctx.font = "30px sans-serif"; 
                ctx.fillText(o.emoji, o.x, o.y);
                
                if (o.y > 370 && o.y < 430 && Math.abs(o.x - player.x) < 30) {
                    if(o.tipo === 'bom') {
                        pontos += 10;
                        qualidade = Math.min(100, qualidade + 5);
                        co2 = Math.max(0, co2 - 0.5);
                        itensBonsColetados++;
                    } else {
                        pontos -= 10;
                        qualidade = Math.max(0, qualidade - 10);
                        co2 += 0.8;
                        itensRuinsColetados++;
                        tempoPiscarPortal = 30; // Ativa o aviso visual no portal por 1 segundo
                    }
                    objetos.splice(i, 1);
                    document.getElementById("txt-pontos").innerText = "Pontos: " + pontos;
                    document.getElementById("txt-co2").innerText = `CO₂: ${co2.toFixed(1)} kg`;
                } else if(o.y > 450) {
                    objetos.splice(i, 1);
                }
            });

            if (pausado) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("JOGO PAUSADO", canvas.width / 2, canvas.height / 2);
                ctx.font = "16px sans-serif";
                ctx.fillText("Pressione 'P' para continuar", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        setInterval(loop, 30);

        const timerInterval = setInterval(() => {
            if (tempo > 0 && !pausado) {
                tempo--;
                document.getElementById("txt-tempo").innerText = `Tempo: ${tempo}s`;
            } else if (tempo <= 0 && !pausado) {
                clearInterval(timerInterval);
                
                if (pontos > recorde) {
                    recorde = pontos;
                    localStorage.setItem("recordePomerode", recorde);
                }

                // Cálculo dos impactos didáticos com base nas coletas
                let hospitaisAjudados = Math.max(1, Math.floor(itensBonsColetados * 0.8));
                let policiaisAjudados = Math.max(1, Math.floor(itensBonsColetados * 1.2));
                let escolasAjudadas = Math.max(1, Math.floor(itensBonsColetados * 1.0));
                let equivalenteChuveiro = Math.round(co2 * 12);

                ctx.fillStyle = "rgba(20, 30, 40, 0.96)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#f1c40f"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("Extrato Final da Missão em Pomerode", canvas.width / 2, 30);
                
                ctx.fillStyle = "white"; ctx.font = "12px sans-serif";
                ctx.fillText(`Pontuação Final: ${pontos} | Recorde: ${recorde}`, canvas.width / 2, 55);
                ctx.fillText(`CO₂ Final: ${co2.toFixed(1)} kg (Equivalente a ${equivalenteChuveiro} minutos de banho no chuveiro elétrico)`, canvas.width / 2, 78);

                ctx.fillStyle = "#3498db"; ctx.font = "bold 13px sans-serif";
                ctx.fillText("O quanto você ajudou a sua cidade a se manter de pé:", canvas.width / 2, 105);

                ctx.fillStyle = "#ecf0f1"; ctx.font = "12px sans-serif";
                ctx.fillText(`🏥 Hospitais beneficiados: ${hospitaisAjudados} unidades`, canvas.width / 2, 128);
                ctx.fillText(`🏫 Escolas auxiliadas: ${escolasAjudadas} instituições`, canvas.width / 2, 148);
                ctx.fillText(`👮 Policiais e Seguranças apoiados: ${policiaisAjudados} equipes`, canvas.width / 2, 168);
                ctx.fillText(`✨ Itens positivos: ${itensBonsColetados} | ⚠️ Itens nocivos: ${itensRuinsColetados}`, canvas.width / 2, 188);

                // Modificado: AVISO EXTREMAMENTE ESPECÍFICO E CLARO QUE OS DADOS SÃO PURAMENTE DIDÁTICOS
                ctx.fillStyle = "#e74c3c"; ctx.font = "bold 11px sans-serif";
                ctx.fillText("⚠️ AVISO EXTREMAMENTE CLARO: TODOS OS DADOS UTILIZADOS NESTE", canvas.width / 2, 222);
                ctx.fillText("JOGO SÃO PURAMENTE DIDÁTICOS, ILUSTRATIVOS E FICTÍCIOS.", canvas.width / 2, 238);
                ctx.fillText("NÃO POSSUEM NENHUM DADO REAL, CIENTÍFICO OU COMPROVADO.", canvas.width / 2, 254);

                ctx.fillStyle = "#2ecc71"; ctx.font = "italic 11px sans-serif";
                ctx.fillText("Continue praticando a sustentabilidade e ajude Pomerode!", canvas.width / 2, 290);

                ctx.fillStyle = "#bdc3c7"; ctx.font = "12px sans-serif";
                ctx.fillText("Pressione F5 para iniciar uma nova partida.", canvas.width / 2, 330);
            }
        }, 1000);
    </script>
</body>
</html>
