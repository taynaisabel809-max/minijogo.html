<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Missão Sustentável - Pomerode</title>
    <style>
        body { margin: 0; padding: 0; background: #2c3e50; display: flex; flex-direction: column; align-items: center; }
        #hud { display: flex; justify-content: space-around; width: 600px; background: #2c3e50; color: white; padding: 10px; font-weight: bold; border-radius: 0 0 8px 8px; }
        canvas { display: block; margin-top: 5px; border-radius: 8px; border: 4px solid #5d4037; }
    </style>
</head>
<body>

    <div id="hud">
        <span id="txt-tempo">Tempo: 120s</span>
        <span id="txt-pontos">Pontos: 0</span>
        <span id="txt-co2">Qualidade: 100%</span>
    </div>

    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let tempo = 120, pontos = 0, qualidade = 100, pausado = false;
        let player = { x: 270, y: 380, w: 45, h: 60, speed: 7, dx: 0 };
        let objetos = [];
        let luzesAtivas = true;

        const teclas = {};
        window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            if (k === 'p') pausado = !pausado;
            if (k === "arrowleft" || k === "a") teclas["left"] = true;
            if (k === "arrowright" || k === "d") teclas["right"] = true;
        });
        window.addEventListener("keyup", (e) => {
            const k = e.key.toLowerCase();
            if (k === "arrowleft" || k === "a") teclas["left"] = false;
            if (k === "arrowright" || k === "d") teclas["right"] = false;
        });

        function desenharPortal() {
            // Estrutura do Portal de Pomerode
            ctx.fillStyle = "#5d4037"; // Madeira
            ctx.fillRect(100, 150, 100, 200); // Esquerda
            ctx.fillRect(400, 150, 100, 200); // Direita
            ctx.fillRect(100, 120, 400, 30);  // Travessa

            // Telhados
            ctx.fillStyle = "#8b4513";
            ctx.beginPath(); ctx.moveTo(80, 150); ctx.lineTo(150, 50); ctx.lineTo(220, 150); ctx.fill();
            ctx.beginPath(); ctx.moveTo(380, 150); ctx.lineTo(450, 50); ctx.lineTo(520, 150); ctx.fill();

            // Luzinhas (Piscam se qualidade baixa)
            ctx.fillStyle = (luzesAtivas || Math.random() > 0.5) ? "#f1c40f" : "transparent";
            for(let i=0; i<40; i++) {
                ctx.fillRect(80 + i*3.5, 150 - (i%2)*20, 4, 4);
            }
        }

        function loop() {
            if (pausado) return;
            
            // Movimento
            player.dx = (teclas["left"] ? -player.speed : 0) + (teclas["right"] ? player.speed : 0);
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + player.dx));

            // Fundo reativo
            ctx.fillStyle = `rgb(${135 - (100-qualidade)}, ${206 - (100-qualidade)}, ${235 - (100-qualidade)})`;
            ctx.fillRect(0,0, canvas.width, canvas.height);

            desenharPortal();
            
            // Boneco
            ctx.fillStyle = "#27ae60"; ctx.fillRect(player.x+5, player.y+20, 30, 25);
            ctx.fillStyle = "#f39c12"; ctx.beginPath(); ctx.arc(player.x+20, player.y+10, 10, 0, Math.PI*2); ctx.fill();

            // Objetos (Lógica simplificada)
            if(Math.random() < 0.03) objetos.push({x: Math.random()*500, y:0, tipo: Math.random() > 0.5 ? 'bom' : 'ruim'});
            
            objetos.forEach((obj, i) => {
                obj.y += 3;
                ctx.font = "30px Arial";
                ctx.fillText(obj.tipo === 'bom' ? '🌳' : '🏭', obj.x, obj.y);
                
                if(obj.y > 400) {
                    if(obj.tipo === 'bom') { pontos+=10; qualidade=Math.min(100, qualidade+5); }
                    else { pontos-=10; qualidade=Math.max(0, qualidade-10); }
                    objetos.splice(i, 1);
                }
            });

            luzesAtivas = (qualidade > 40);
        }

        setInterval(loop, 30);
    </script>
</body>
</html>
